    - data:
        code: "import json\nfrom collections import defaultdict\n\ndef main(arg1:\
          \ str) -> dict:\n    part = arg1.split('```json', 1)[-1]\n    json_content\
          \ = part.split('```', 1)[0].strip()\n    \n    try:\n        data = json.loads(json_content)\n\
          \        table = []\n        code_count = defaultdict(int)\n        code_occur\
          \ = defaultdict(int)  # 记录每张发票是第几次出现\n\n        # 先统计所有发票号码出现次数\n      \
          \  for item in data:\n            code = item.get('发票号码', '')\n        \
          \    if code:\n                code_count[code] += 1\n\n        # 开始生成明细\n\
          \        table_str = \"\\n\\n\U0001F4C4 发票明细如下：\\n\"\n        \n       \
          \ for i, item in enumerate(data, 1):\n            code = item.get('发票号码',\
          \ '')\n            date = item.get('开票日期', '')\n            amount = item.get('金额',\
          \ '')\n            proname = item.get('项目名称', '')\n            \n      \
          \      code_occur[code] += 1\n            current_num = code_occur[code]\n\
          \n            # 拼接状态 + 标识符号\n            if code_count[code] >= 2:\n   \
          \             if current_num == 1:\n                    status = \"（重复第一次）\"\
          \n                    prefix = \"⚠️\"\n                elif current_num\
          \ == 2:\n                    status = \"（重复第二次）\"\n                    prefix\
          \ = \"⚠️\"\n                else:\n                    status = f\"（重复第{current_num}次）\"\
          \n                    prefix = \"⚠️\"\n            else:\n             \
          \   status = \"（正常发票）\"\n                prefix = \"✅\"\n\n            #\
          \ 按你要的格式输出，把标识符号加在行首\n            table_str += f\"{prefix}第{i}张：发票号码={code}，日期={date}，项目名称={proname}，金额={amount}{status}\\\
          n\\n\"\n\n        # 查重提示\n        total = len(data)\n        duplicate_info\
          \ = []\n        for code, cnt in code_count.items():\n            if cnt\
          \ >= 2:\n                duplicate_info.append(f\"{code}（重复{cnt}次）\")\n\n\
          \        if duplicate_info:\n            msg = f\"本次共上传：{total}张发票，存在重复发票，代码为：{'，'.join(duplicate_info)}\"\
          \n        else:\n            msg = f\"本次共上传：{total}张发票，无代码重复发票\"\n\n   \
          \     final = msg + table_str\n        return {\"result\": final.strip()}\n\
          \        \n    except json.JSONDecodeError:\n        return {\"result\"\
          : \"JSON解析失败，请检查发票格式\"}"
