<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>票据风险审核 Agent｜交互演示</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e9f0;--blue:#315efb;--blue2:#eaf0ff;--red:#c93445;--red2:#fff0f2;--amber:#a86600;--amber2:#fff6df;--green:#16734b;--green2:#e9f8f0;--shadow:0 14px 34px #21304d0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer;border:0}.wrap{max-width:1180px;margin:auto;padding:34px 22px 60px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em;font-size:12px}.hero h1{font-size:30px;line-height:1.2;margin:8px 0}.hero p{color:var(--muted);margin:0;max-width:700px}.badge{background:var(--amber2);color:var(--amber);border:1px solid #f2d58b;padding:7px 12px;border-radius:999px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.panel,.case{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:17px}.stat b{font-size:25px;display:block}.stat span{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter{padding:7px 10px;background:#f6f7fa;color:var(--muted);border-radius:8px}.filter.active{background:var(--blue2);color:var(--blue);font-weight:700}.case{padding:14px;margin:9px 0;box-shadow:none;cursor:pointer}.case.selected{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue2)}.case-top{display:flex;justify-content:space-between;gap:10px;font-weight:700}.case small{color:var(--muted)}.pill{padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.high{color:var(--red);background:var(--red2)}.review{color:var(--amber);background:var(--amber2)}.pass{color:var(--green);background:var(--green2)}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.detail-head h2{font-size:22px;margin:0 0 4px}.detail-head p{color:var(--muted);margin:0}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.evidence div{padding:12px;border:1px solid var(--line);border-radius:12px}.label{font-size:12px;color:var(--muted);display:block}.value{font-weight:700}.rule{border-left:3px solid var(--blue);padding:10px 12px;background:#f7f9ff;margin:10px 0}.rule strong{display:block}.timeline{display:flex;gap:5px;margin:20px 0}.step{flex:1;text-align:center;font-size:12px;color:var(--muted)}.dot{height:8px;background:var(--line);border-radius:9px;margin-bottom:7px}.step.done{color:var(--green)}.step.done .dot{background:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:var(--blue);color:#fff;padding:10px 15px;border-radius:9px}.secondary{background:#f1f3f7;color:var(--ink);padding:10px 15px;border-radius:9px}.note{font-size:12px;color:var(--muted);padding:12px;background:#fafafa;border-radius:10px;margin-top:16px}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{display:block}.badge{display:inline-block;margin-top:14px}} 
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div><div class="eyebrow">PORTFOLIO DEMO · HUMAN IN THE LOOP</div><h1>企业报销票据风险审核 Agent</h1><p>用确定性规则筛出重复与近似异常，并把每条结论连到可解释证据。这个页面只演示公开仓库中的合成结构化数据，不代表税务验真或生产审批。</p></div><div class="badge">演示版 · 合成数据 · 不自动放行</div></header>
<section class="stats"><div class="stat"><b>5</b><span>本批票据</span></div><div class="stat"><b>3</b><span>高风险</span></div><div class="stat"><b>4</b><span>待人工复核</span></div><div class="stat"><b>0%</b><span>真实自动放行率</span></div></section>
<section class="layout"><aside class="panel"><h2>审核队列</h2><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="high">高风险</button><button class="filter" data-filter="review">待复核</button><button class="filter" data-filter="pass">通过</button></div><div id="cases"></div></aside><article class="panel"><div id="detail"></div></article></section>
</main>
<script>
const cases=[
{id:"IN-001",seller:"上海云图信息技术有限公司",amount:"¥1,280.00",status:"high",statusText:"高风险",reason:"同批次文件哈希与发票号码均重复",rules:["R10 文件哈希重复","R11 发票号码重复"],date:"2026-08-18",invoice:"03123456"},
{id:"IN-002",seller:"上海云图信息技术有限公司",amount:"¥1,280.00",status:"high",statusText:"高风险",reason:"与 IN-001 命中同一重复组",rules:["R10 文件哈希重复","R11 发票号码重复"],date:"2026-08-18",invoice:"03123456"},
{id:"IN-003",seller:"北京星河软件有限公司",amount:"¥860.00",status:"high",statusText:"高风险",reason:"与历史台账 H-001 的发票号码相同",rules:["R20 历史台账重复"],date:"2026-08-15",invoice:"04481290"},
{id:"IN-004",seller:"杭州青禾文化有限公司",amount:"¥520.00",status:"review",statusText:"待复核",reason:"销售方与金额相同，日期相差 2 天，号码不同",rules:["R30 近似异常：同销售方+金额+近日期"],date:"2026-08-17",invoice:"06517823"},
{id:"IN-005",seller:"深圳澄明科技有限公司",amount:"¥316.00",status:"pass",statusText:"规则通过",reason:"未发现重复或结构化异常，仍需人工确认",rules:["无命中规则"],date:"2026-08-16",invoice:"08291044"}
];
let current=cases[0], reviewed=false, filter="all";
function renderList(){const list=cases.filter(x=>filter==="all"||x.status===filter);document.querySelector("#cases").innerHTML=list.map(x=>'<div class="case '+(x.id===current.id?"selected":"")+'" data-id="'+x.id+'"><div class="case-top"><span>'+x.id+'</span><span class="pill '+x.status+'">'+x.statusText+'</span></div><small>'+x.seller+' · '+x.amount+'</small><br><small>'+x.reason+'</small></div>').join("");document.querySelectorAll(".case").forEach(el=>el.onclick=()=>{current=cases.find(x=>x.id===el.dataset.id);reviewed=false;render()})}
function renderDetail(){const x=current;const reviewText=reviewed?"已记录人工复核：结论保留，等待最终审批":"待人工复核";document.querySelector("#detail").innerHTML='<div class="detail-head"><div><h2>'+x.id+' <span class="pill '+x.status+'">'+(reviewed?"已复核":x.statusText)+'</span></h2><p>'+x.reason+'</p></div><span class="label">决策状态<br><b>'+reviewText+'</b></span></div><div class="timeline"><div class="step done"><div class="dot"></div>字段提取</div><div class="step done"><div class="dot"></div>规则比对</div><div class="step done"><div class="dot"></div>风险分流</div><div class="step"><div class="dot"></div>人工确认</div></div><div class="evidence"><div><span class="label">销售方</span><span class="value">'+x.seller+'</span></div><div><span class="label">含税金额</span><span class="value">'+x.amount+'</span></div><div><span class="label">开票日期</span><span class="value">'+x.date+'</span></div><div><span class="label">发票号码</span><span class="value">'+x.invoice+'</span></div></div><h2>规则证据</h2>'+x.rules.map(r=>'<div class="rule"><strong>'+r+'</strong><span>系统仅展示结构化比对结果；二维码读取不等于税务平台验真。</span></div>').join("")+'<div class="actions"><button class="primary" id="review">'+(reviewed?"已完成人工复核":"记录人工复核")+'</button><button class="secondary" id="next">查看下一条</button></div><div class="note">安全边界：公开 Demo 不连接税务平台、不执行自动审批、不保存真实票据。生产环境仍需权限、审计日志和人工最终确认。</div>'}
function render(){renderList();renderDetail();document.querySelector("#review").onclick=()=>{reviewed=true;render()};document.querySelector("#next").onclick=()=>{current=cases[(cases.indexOf(current)+1)%cases.length];reviewed=false;render()};document.querySelectorAll(".filter").forEach(el=>el.onclick=()=>{filter=el.dataset.filter;document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===el));if(!cases.filter(x=>filter==="all"||x.status===filter).includes(current))current=cases.find(x=>filter==="all"||x.status===filter);render()})}
render();
</script>
</body>
</html>
